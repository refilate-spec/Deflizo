<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Premium Discoveries</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#6366f1', darkbg: '#0f172a', darkcard: '#1e293b' } } }
        }
    </script>
    <style>
        /* Hide Scrollbar for Sliders but keep functionality */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(30, 41, 59, 0.7); }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-darkbg text-gray-900 dark:text-gray-100 transition-colors duration-300 pb-20 md:pb-0">

    <!-- Top Navigation -->
    <nav class="sticky top-0 z-50 glass border-b border-gray-200 dark:border-gray-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-primary to-purple-500">
                NEXUS.
            </a>
            <div class="hidden md:flex flex-1 max-w-xl mx-8 relative">
                <i class="ph ph-magnifying-glass absolute left-3 top-3 text-gray-400 text-lg"></i>
                <input type="text" id="searchInput" placeholder="Search products, brands, categories..." class="w-full pl-10 pr-4 py-2 rounded-full bg-gray-100 dark:bg-gray-800 border-none focus:ring-2 focus:ring-primary outline-none transition-all">
            </div>
            <div class="flex items-center gap-4">
                <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    <i class="ph ph-moon text-xl dark:hidden"></i>
                    <i class="ph ph-sun text-xl hidden dark:block"></i>
                </button>
                <div class="relative cursor-pointer hidden md:block" id="wishlistBtn">
                    <i class="ph ph-heart text-2xl"></i>
                    <span id="wishlistCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-4 w-4 flex items-center justify-center">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Categories Rail (Drag to scroll) -->
        <section class="mb-8 relative">
            <h2 class="text-lg font-semibold mb-3">Explore Categories</h2>
            <div id="categorySlider" class="flex gap-4 overflow-x-auto hide-scroll cursor-grab active:cursor-grabbing pb-2 snap-x">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Featured Products Grid -->
        <section>
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-2xl font-bold">Trending Now</h2>
                <a href="#" class="text-primary text-sm font-medium hover:underline">View All</a>
            </div>
            <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                <!-- Injected via JS -->
            </div>
        </section>
    </main>

    <!-- Mobile Bottom Nav -->
    <div class="md:hidden fixed bottom-0 w-full glass border-t border-gray-200 dark:border-gray-800 flex justify-around py-3 z-50 env(safe-area-inset-bottom)">
        <a href="index.html" class="flex flex-col items-center text-primary"><i class="ph-fill ph-house text-2xl"></i><span class="text-[10px]">Home</span></a>
        <a href="#" class="flex flex-col items-center text-gray-500 dark:text-gray-400"><i class="ph ph-magnifying-glass text-2xl"></i><span class="text-[10px]">Search</span></a>
        <a href="#" class="flex flex-col items-center text-gray-500 dark:text-gray-400 relative">
            <i class="ph ph-heart text-2xl"></i><span class="text-[10px]">Saved</span>
            <span id="mobileWishlistCount" class="absolute -top-1 right-2 bg-red-500 text-white text-[9px] rounded-full h-3 w-3 flex items-center justify-center">0</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-500 dark:text-gray-400"><i class="ph ph-user text-2xl"></i><span class="text-[10px]">Profile</span></a>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
