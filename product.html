<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#6366f1', darkbg: '#0f172a', darkcard: '#1e293b' } } } }
    </script>
    <style>.glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); } .dark .glass { background: rgba(30,41,59,0.7); }</style>
</head>
<body class="bg-gray-50 dark:bg-darkbg text-gray-900 dark:text-gray-100 transition-colors duration-300 pb-24 md:pb-0">

    <!-- Simple Nav -->
    <nav class="sticky top-0 z-50 glass border-b border-gray-200 dark:border-gray-800 px-4 py-3 flex justify-between items-center">
        <button onclick="history.back()" class="p-2 rounded-full bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 transition"><i class="ph ph-arrow-left text-xl"></i></button>
        <span class="font-semibold text-lg truncate w-1/2 text-center" id="navTitle">Loading...</span>
        <div class="flex gap-2">
            <button id="shareBtn" class="p-2 rounded-full bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 transition"><i class="ph ph-share-network text-xl"></i></button>
        </div>
    </nav>

    <!-- Product Container -->
    <main id="productContainer" class="max-w-5xl mx-auto px-4 py-6 md:py-10 grid md:grid-cols-2 gap-8 opacity-0 transition-opacity duration-500">
        <!-- Image Gallery (Left) -->
        <div class="rounded-2xl overflow-hidden bg-white dark:bg-darkcard border border-gray-100 dark:border-gray-800 flex items-center justify-center aspect-square shadow-sm relative">
            <img id="pdImage" src="" alt="Product Image" class="w-full h-full object-contain p-4 mix-blend-multiply dark:mix-blend-normal">
            <button id="pdWishlistBtn" class="absolute top-4 right-4 p-3 rounded-full glass shadow-md hover:scale-110 transition-transform text-gray-400">
                <i class="ph-fill ph-heart text-2xl"></i>
            </button>
        </div>

        <!-- Product Info (Right) -->
        <div class="flex flex-col">
            <div class="flex items-center gap-2 mb-2 text-sm text-primary font-medium uppercase tracking-wide" id="pdBrand"></div>
            <h1 id="pdTitle" class="text-2xl md:text-4xl font-bold leading-tight mb-4"></h1>
            <div class="flex items-center gap-3 mb-6">
                <span id="pdPrice" class="text-3xl font-extrabold text-gray-900 dark:text-white"></span>
                <span class="px-2 py-1 bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 text-xs rounded-md font-bold">In Stock</span>
            </div>
            
            <p id="pdDesc" class="text-gray-600 dark:text-gray-400 mb-8 leading-relaxed"></p>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white dark:bg-darkcard p-4 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm">
                    <h3 class="text-green-600 font-bold mb-2 flex items-center gap-1"><i class="ph ph-check-circle"></i> Pros</h3>
                    <ul id="pdPros" class="text-sm space-y-1 text-gray-600 dark:text-gray-400 list-disc pl-4"></ul>
                </div>
                <div class="bg-white dark:bg-darkcard p-4 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm">
                    <h3 class="text-red-500 font-bold mb-2 flex items-center gap-1"><i class="ph ph-x-circle"></i> Cons</h3>
                    <ul id="pdCons" class="text-sm space-y-1 text-gray-600 dark:text-gray-400 list-disc pl-4"></ul>
                </div>
            </div>

            <!-- CTA Buttons (Fixed bottom on mobile) -->
            <div class="fixed md:static bottom-0 left-0 w-full glass md:bg-transparent md:backdrop-filter-none border-t border-gray-200 dark:border-gray-800 md:border-none p-4 md:p-0 z-40 flex gap-4">
                <a id="pdBuyBtn" href="#" target="_blank" class="flex-1 bg-primary hover:bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-500/30 flex justify-center items-center gap-2 transition-all active:scale-95">
                    View Offers & Buy <i class="ph ph-arrow-up-right"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px] z-50 flex items-center gap-2">
        <i class="ph ph-check-circle text-green-400 text-xl"></i>
        <span id="toastMsg">Action successful</span>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
